# SPDX-License-Identifier: MIT
# Thin caller: all CI logic lives in dl9pf-agl/agl-ci, pinned here by full commit SHA (bumped by hand through a pull request; this repo has no Dependabot).
name: ci
on:
  pull_request:
  schedule:
    - cron: '17 1 * * *'   # nightly on the default branch, 01:17 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: 'Matrix tier to build'
        type: choice
        options: [push-pr, nightly, release, dispatch]
        default: dispatch
      mode:
        description: 'build = validate + build; drill = offline fetch (outage drill); drill-mirror = fetch from the mirror alone (needs the repo variable AGL_MIRROR_URL); fetch = fill the download cache'
        type: choice
        options: [build, drill, drill-mirror, fetch]
        default: build

permissions:
  contents: read

jobs:
  ci:
    uses: dl9pf-agl/agl-ci/.github/workflows/layer-ci.yml@d53c0d333e7615dc64772c651b4fac05ec158b7a # main (agl-ci d53c0d3: validate --verbose, builder digest)
    with:
      repo: meta-agl
      tier: ${{ inputs.tier }}
      mode: ${{ inputs.mode || 'build' }}

  # Nightly: fetch the sources of every image of the matrix (tier dispatch), also the ones that are not built, so that the
  # download cache and the source mirror hold them.
  fetch:
    if: github.event_name == 'schedule'
    uses: dl9pf-agl/agl-ci/.github/workflows/layer-ci.yml@d53c0d333e7615dc64772c651b4fac05ec158b7a # main (agl-ci d53c0d3: validate --verbose, builder digest)
    with:
      repo: meta-agl
      tier: dispatch
      mode: fetch
